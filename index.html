<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kiểm tra Trường hấp dẫn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bitter:wght@600;700&display=swap">
<style>
/* Layout: thẻ câu hỏi bên trái, bảng điều hướng 35 câu bên phải; màn hình bắt đầu và màn hình kết quả là hai thẻ giữa trang. */
:root {
  --bg: #f3f6fb; --fg: #14203a; --muted: #55627d; --card: #ffffff; --line: #cfd8e8;
  --accent: #14707f; --accent-ink: #ffffff; --accent-soft: #d9eef2;
  --key: #f28c28; --key-ink: #2e1a00;
  --ok: #1f7a4d; --ok-soft: #dff3e8; --bad: #b3314d; --bad-soft: #fbe3e8;
  --warn: #9a5b00; --warn-soft: #fff0d6;
  --font-display: "Bitter", Cambria, Georgia, serif;
  --font-body: "Be Vietnam Pro", Calibri, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1730; --fg: #e8eefb; --muted: #9db0d3; --card: #122447; --line: #2a3d66;
    --accent: #4fc3d6; --accent-ink: #06222a; --accent-soft: #123f4b;
    --key: #f28c28; --key-ink: #2e1a00;
    --ok: #62d094; --ok-soft: #123a2a; --bad: #ff8aa3; --bad-soft: #4a1b28;
    --warn: #f2b35a; --warn-soft: #4a3410; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1730; --fg: #e8eefb; --muted: #9db0d3; --card: #122447; --line: #2a3d66;
  --accent: #4fc3d6; --accent-ink: #06222a; --accent-soft: #123f4b;
  --key: #f28c28; --key-ink: #2e1a00;
  --ok: #62d094; --ok-soft: #123a2a; --bad: #ff8aa3; --bad-soft: #4a1b28;
  --warn: #f2b35a; --warn-soft: #4a3410; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.95rem; margin: 4px 0 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
sup, sub { line-height: 0; font-size: 0.72em; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { font-weight: 600; font-size: 0.95rem; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* start */
.start { display: grid; gap: 18px; max-width: 760px; margin: 0 auto; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.mode { text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer; display: grid; gap: 6px; }
.mode:hover { border-color: var(--accent); }
.mode b { font-family: var(--font-display); font-size: 1.1rem; }
.mode span { color: var(--muted); font-size: 0.92rem; }
table.sc { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
table.sc th, table.sc td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.sc th { color: var(--muted); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }

/* quiz */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 0.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
main.q { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
@media (max-width: 860px) { main.q { grid-template-columns: minmax(0, 1fr); } }
.qhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 10px; }
.chip { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.pts { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stem { font-size: 1.12rem; margin: 0 0 14px; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt i { font-style: normal; font-weight: 700; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); background: var(--card); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel i { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok i { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad i { background: var(--bad); color: var(--bg); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.stm { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stm.ok { border-color: var(--ok); } .stm.bad { border-color: var(--bad); }
.stm p { margin: 0; }
.stm .lab { font-weight: 700; margin-right: 6px; color: var(--accent); }
.tf { display: flex; gap: 6px; }
.tf button { min-width: 64px; padding: 8px 12px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; font-size: 0.92rem; }
.tf button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tf button.key { box-shadow: 0 0 0 2.5px var(--ok); }
.tf button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.tf button:disabled { cursor: default; }
.why { grid-column: 1 / -1; margin: 0; font-size: 0.92rem; color: var(--muted); }
.stm.ok .why b { color: var(--ok); } .stm.bad .why b { color: var(--bad); }
.explain { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 0.95rem; }
.explain b { display: block; margin-bottom: 2px; }
.explain.ok b { color: var(--ok); } .explain.bad b { color: var(--bad); }
.nav2 { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 16px; }
.grp { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.nb { height: 38px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 600; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.nb.done { background: var(--accent-soft); border-color: var(--accent); }
.nb.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.nb.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.nb.part { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.nb.cur { box-shadow: 0 0 0 2.5px var(--fg); }
aside.nav { display: grid; gap: 16px; position: sticky; top: 12px; }
@media (max-width: 860px) { aside.nav { position: static; } }

/* result */
.result { display: grid; gap: 16px; max-width: 820px; margin: 0 auto; }
.pill.low { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.big { font-family: var(--font-display); font-size: clamp(3rem, 12vw, 4.6rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.big small { font-size: 0.4em; color: var(--muted); }
.parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .parts { grid-template-columns: minmax(0, 1fr); } }
.part { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 2px; }
.part b { font-size: 1.5rem; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.part span { color: var(--muted); font-size: 0.9rem; }
.meter { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.who { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 600px) { .who { grid-template-columns: minmax(0, 1fr); } }
.who label { display: grid; gap: 4px; font-weight: 600; font-size: 0.9rem; }
.who input { font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.who input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.lv { display: grid; grid-template-columns: 110px minmax(0, 1fr) 60px; gap: 10px; align-items: center; font-size: 0.92rem; }
.fig { margin: 0 0 16px; display: grid; gap: 8px; justify-items: center; }
.fig svg { width: 100%; max-width: 520px; height: auto; border-radius: 16px; box-shadow: 0 6px 18px rgba(20, 32, 58, .18); }
.fig figcaption { color: var(--muted); font-size: 0.88rem; text-align: center; }
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------- dữ liệu ---------- */
const MCQ = [
  { lv: 0, q: "Phát biểu nào sau đây về lực hấp dẫn là đúng?", o: ["Lực hấp dẫn chỉ xuất hiện khi hai vật tiếp xúc với nhau.", "Lực hấp dẫn giữa hai vật có khối lượng luôn là lực hút.", "Lực hấp dẫn có thể là lực hút hoặc lực đẩy tùy khối lượng của vật.", "Lực hấp dẫn chỉ tác dụng giữa Trái Đất và các vật ở gần mặt đất."], a: 1, e: "Mọi vật có khối lượng đều hút nhau bằng lực hấp dẫn, tác dụng từ xa mà không cần tiếp xúc." },
  { lv: 0, q: "Nhà bác học nào phát hiện ra lực làm viên đá rơi xuống mặt đất có cùng bản chất với lực giữ Mặt Trăng quay quanh Trái Đất?", o: ["Cavendish", "Kepler", "Newton", "Tycho Brahe"], a: 2, e: "Newton nhận ra lực làm vật rơi, lực giữ Mặt Trăng quanh Trái Đất và lực giữ các hành tinh quanh Mặt Trời cùng là lực hấp dẫn." },
  { lv: 0, q: "Định luật vạn vật hấp dẫn: hai vật tương tác với nhau bằng một lực có độ lớn …", o: ["tỉ lệ thuận với khoảng cách và tỉ lệ nghịch với tích hai khối lượng.","tỉ lệ thuận với tích khối lượng và tỉ lệ nghịch với bình phương khoảng cách.","tỉ lệ nghịch với tích khối lượng và tỉ lệ thuận với bình phương khoảng cách.","tỉ lệ thuận với tổng hai khối lượng và tỉ lệ nghịch với khoảng cách."], a: 1, e: "F tỉ lệ thuận với m_{1}m_{2} và tỉ lệ nghịch với r^{2}." },
  { lv: 0, q: "Biểu thức độ lớn lực hấp dẫn giữa hai chất điểm có khối lượng m_{1}, m_{2} cách nhau r là:", o: ["F_{hd} = G·m_{1}m_{2}/r", "F_{hd} = G·m_{1}m_{2}/r^{2}", "F_{hd} = G·(m_{1} + m_{2})/r^{2}", "F_{hd} = G·m_{1}m_{2}·r^{2}"], a: 1, e: "Đây là biểu thức (1.1): F_{hd} = G·m_{1}m_{2}/r^{2}." },
  { lv: 0, q: "Trong hệ SI, hằng số hấp dẫn G có đơn vị là:", o: ["N·m/kg", "N·kg^{2}/m^{2}", "N·m^{2}/kg^{2}", "N·kg/m^{2}"], a: 2, e: "Từ G = F·r^{2}/(m_{1}m_{2}) suy ra đơn vị N·m^{2}/kg^{2}." },
  { lv: 0, q: "Giá trị của hằng số hấp dẫn G (theo SGK) là:", o: ["6,68·10^{−11} N·m^{2}/kg^{2}", "6,68·10^{11} N·m^{2}/kg^{2}", "9,81 N·m^{2}/kg^{2}", "6,68·10^{−6} N·m^{2}/kg^{2}"], a: 0, e: "G = 6,68·10^{−11} N·m^{2}/kg^{2}, một giá trị rất nhỏ." },
  { lv: 0, q: "Biểu thức F_{hd} = G·m_{1}m_{2}/r^{2} có thể áp dụng cho trường hợp nào sau đây?", o: ["Hai vật bất kì, có hình dạng tùy ý, đặt cách nhau một khoảng bất kì.","Hai chất điểm, hoặc hai quả cầu đồng chất với r là khoảng cách hai tâm.","Chỉ hai vật có khối lượng bằng nhau và đặt cách nhau rất xa.","Chỉ giữa Trái Đất và một vật đang rơi tự do ở gần mặt đất."], a: 1, e: "Khối lượng phân bố đều trong vật hình cầu được xem như tập trung ở tâm, nên r là khoảng cách giữa hai tâm." },
  { lv: 0, q: "Ai là người đầu tiên đo được độ lớn của hằng số hấp dẫn G bằng thí nghiệm?", o: ["Newton", "Kepler", "Galileo", "Cavendish"], a: 3, e: "Henry Cavendish đo được G hơn một thế kỉ sau khi Newton phát hiện định luật." },
  { lv: 0, q: "Thí nghiệm của Cavendish phát hiện lực hấp dẫn rất nhỏ bằng cách nào?", o: ["Đo độ dãn của một lò xo gắn với hai quả cầu chì.","Đo góc xoắn của sợi dây thạch anh qua vết sáng phản xạ trên gương.","Đo chu kì dao động của con lắc đơn đặt gần hai quả cầu.","So sánh trọng lượng hai quả cầu trên một chiếc cân đòn nhạy."], a: 1, e: "Lực hấp dẫn giữa quả cầu lớn và quả cầu nhỏ làm dây treo xoắn, tia sáng phản xạ dịch chuyển trên thước, từ đó tính được góc xoắn và G." },
  { lv: 0, q: "Về mối quan hệ giữa trọng lực và lực hấp dẫn, phát biểu nào đúng?", o: ["Trọng lực là loại lực hoàn toàn khác với lực hấp dẫn của Trái Đất.","Trọng lực là lực hấp dẫn của Trái Đất tác dụng lên vật có khối lượng.","Trọng lực là lực hấp dẫn xuất hiện giữa hai vật có khối lượng bất kì.","Trọng lực chỉ xuất hiện khi vật đang chuyển động rơi xuống đất."], a: 1, e: "Trên Trái Đất, trọng lực là lực hấp dẫn của Trái Đất tác dụng lên vật." },
  { lv: 1, img: "ball", q: "Một quả bóng khối lượng không đổi đặt lần lượt ở nhiều vị trí khác nhau trên mặt Trái Đất. Lực hấp dẫn của Trái Đất tác dụng lên quả bóng ở các vị trí đó:", o: ["bằng nhau về độ lớn, có phương là đường nối với tâm Trái Đất, hướng về tâm.","bằng nhau về độ lớn và có chung một phương thẳng đứng ở mọi vị trí.","khác nhau về độ lớn vì quả bóng ở những vị trí khác nhau trên mặt đất.","bằng nhau về độ lớn, có phương tiếp tuyến với mặt đất tại mỗi vị trí."], a: 0, e: "Khoảng cách tới tâm Trái Đất như nhau nên độ lớn bằng nhau; phương là đường nối với tâm, chiều hướng vào tâm." },
  { lv: 1, q: "Khi khoảng cách giữa hai vật tăng gấp đôi (khối lượng không đổi) thì lực hấp dẫn giữa chúng:", o: ["tăng gấp đôi.", "giảm 2 lần.", "giảm 4 lần.", "tăng 4 lần."], a: 2, e: "F tỉ lệ nghịch với r^{2}: r tăng 2 lần thì F giảm 2^{2} = 4 lần." },

let saveState = "";
let saveStarted = false;

function sendResultToSheet() {
  if (saveStarted) return;
  saveStarted = true;
  const r = scores();
  const payload = {
    timestamp: new Date().toISOString(),
    fullName: who.name.trim(),
    className: who.cls.trim(),
    quiz: "Kiểm tra Trường hấp dẫn",
    subject: "Vật lí 11",
    multipleChoiceCorrect: r.m,
    multipleChoiceScore: Number(r.mp.toFixed(3)),
    trueFalseCorrectStatements: r.n,
    trueFalseScore: Number(r.d.toFixed(3)),
    totalScore: Number(r.total.toFixed(3)),
    duration: elapsed(),
    submissionType: st.auto === "time" ? "Tự động - hết giờ" : st.auto ? "Tự động - chuyển tab" : "Học sinh nộp",
    autoSubmit: Boolean(st.auto)
  };

  const statusEl = document.getElementById("syncStatus");
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("DAN_URL_WEB_APP")) {
    saveState = "Chưa cấu hình URL Apps Script nên điểm chưa được gửi.";
    if (statusEl) statusEl.textContent = saveState;
    return;
  }

  try {
    // Gửi bằng form POST ẩn để tránh lỗi CORS/preflight khi trang chạy trên GitHub Pages.
    let frame = document.getElementById("scoreSubmitFrame");
    if (!frame) {
      frame = document.createElement("iframe");
      frame.name = "scoreSubmitFrame";
      frame.id = "scoreSubmitFrame";
      frame.style.display = "none";
      document.body.appendChild(frame);
    }
    const form = document.createElement("form");
    form.method = "POST";
    form.action = GOOGLE_SCRIPT_URL;
    form.target = "scoreSubmitFrame";
    form.style.display = "none";
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "payload";
    input.value = JSON.stringify(payload);
    form.appendChild(input);
    document.body.appendChild(form);

"52\" y=\"190.6032457364131\" font-family=\"Be Vietnam Pro, Segoe UI, Calibri, sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#14203a\" text-anchor=\"middle\" >h = 300 m</text><text x=\"240\" y=\"292\" font-family=\"Be Vietnam Pro, Segoe UI, Calibri, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\" stroke=\"#12472a\" stroke-width=\"3.5\" paint-order=\"stroke\">Trái Đất (R = 6 400 km)</text></svg>", cap: "Hình minh họa: đại bác của Newton trên đỉnh núi (không đúng tỉ lệ)" }
};
const fig = (k) => (k && FIGS[k] ? `<figure class="fig">${FIGS[k].svg}<figcaption>${FIGS[k].cap}</figcaption></figure>` : "");

/* ---------- tiện ích ---------- */
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fm = (s) => esc(s).replace(/\^\{([^}]*)\}/g, "<sup>$1</sup>").replace(/_\{([^}]*)\}/g, "<sub>$1</sub>");
const fmt = (x) => Number((Math.round(x * 1000) / 1000).toFixed(3)).toString().replace(".", ",");
function shuffle(n) { const a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- trạng thái ---------- */
let st = null;
const who = { name: "", cls: "" };
const TOTAL = MCQ.length + DS.length;
function fresh() {
  return { cur: 0, ordM: shuffle(MCQ.length), ordD: shuffle(DS.length), mcq: Array(MCQ.length).fill(null), ds: DS.map(() => [null, null, null, null]), perm: MCQ.map((q) => shuffle(q.o.length)), done: false, auto: false, ask: false, t0: Date.now(), tEnd: 0 };
}
const real = (p) => (p < MCQ.length ? st.ordM[p] : MCQ.length + st.ordD[p - MCQ.length]);
function dsRight(j) { return DS[j].s.reduce((n, x, k) => n + (st.ds[j][k] === x.v ? 1 : 0), 0); }
function scores() {
  let m = 0; MCQ.forEach((q, i) => { if (st.mcq[i] === q.a) m++; });
  let d = 0, n = 0; DS.forEach((_, j) => { const r = dsRight(j); d += DS_PTS[r]; n += r; });
  return { m, mp: m * MCQ_PTS, d, n, total: m * MCQ_PTS + d };
}
function answered(p) { const r = real(p); return r < MCQ.length ? st.mcq[r] !== null : st.ds[r - MCQ.length].every((v) => v !== null); }
const LIMIT = 35 * 60;
const left = () => Math.max(0, LIMIT - Math.floor((Date.now() - st.t0) / 1000));
const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const elapsed = () => { const s = Math.floor(((st.done ? st.tEnd : Date.now()) - st.t0) / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- giao diện ---------- */
function startView() {
  return `<div class="start">
    <div><h1>Bài kiểm tra Trường hấp dẫn</h1><p class="sub">Vật lí 11 · Chuyên đề 1 · 35 câu · 35 phút · thang 10 điểm</p></div>
    <div class="card" style="display:grid;gap:14px">
      <table class="sc num">
        <thead><tr><th>Phần</th><th>Số câu</th><th>Cách tính điểm</th><th>Tổng</th></tr></thead>
        <tbody>
          <tr><td>I. Trắc nghiệm khách quan</td><td>25</td><td>0,2 điểm mỗi câu</td><td>5 điểm</td></tr>
          <tr><td>II. Đúng sai (mỗi câu 4 ý)</td><td>10</td><td>Lũy tiến: đúng 1 ý được 0,05; 2 ý được 0,125; 3 ý được 0,25; 4 ý được 0,5 điểm</td><td>5 điểm</td></tr>
        </tbody>
      </table>
      <div class="explain" style="margin:0"><b>Lưu ý trước khi làm bài</b>Thời gian làm bài tối đa 35 phút, hết giờ bài được nộp tự động. Thứ tự câu hỏi được xáo trộn. Em có thể đổi đáp án trước khi nộp. Nếu chuyển sang tab hoặc cửa sổ khác, bài sẽ được nộp ngay. Sau khi nộp chỉ hiện điểm, không hiện đáp án.</div>
      <div class="who"><label>Họ và tên<input id="fname" type="text" autocomplete="off" maxlength="60" value="${esc(who.name)}"></label><label>Lớp<input id="fclass" type="text" autocomplete="off" maxlength="20" value="${esc(who.cls)}"></label></div>
      <div class="row"><button class="btn" id="go" data-act="start" ${who.name.trim() && who.cls.trim() ? "" : "disabled"}>Bắt đầu làm bài</button><span class="sub">Nhập họ tên và lớp để bắt đầu.</span></div>
    </div>
  </div>`;
}

function qCard(p) {
  const r = real(p);
  if (r < MCQ.length) {
    const q = MCQ[r], sel = st.mcq[r];
    const opts = st.perm[r].map((oi, pos) => `<button class="opt ${oi === sel ? "sel" : ""}" data-act="pick" data-i="${r}" data-o="${oi}"><i>${"ABCD"[pos]}</i><span>${fm(q.o[oi])}</span></button>`).join("");
    return `<div class="qhead"><span class="chip">Phần I · Câu ${p + 1}</span><span class="pts">0,2 điểm</span></div><p class="stem">${fm(q.q)}</p>${fig(q.img)}<div class="opts">${opts}</div>`;
  }
  const j = r - MCQ.length, d = DS[j];
  const rows = d.s.map((x, k) => {
    const v = st.ds[j][k];
    const bt = [true, false].map((b) => `<button class="${v === b ? "sel" : ""}" data-act="tf" data-j="${j}" data-k="${k}" data-v="${b}">${b ? "Đúng" : "Sai"}</button>`).join("");
    return `<div class="stm"><p><span class="lab">${"abcd"[k]})</span>${fm(x.t)}</p><div class="tf" role="group" aria-label="Ý ${"abcd"[k]}">${bt}</div></div>`;
  }).join("");
  return `<div class="qhead"><span class="chip">Phần II · Câu ${p - MCQ.length + 1} · Đúng sai</span><span class="pts">tối đa 0,5 điểm</span></div><p class="stem">${fm(d.q)}</p>${fig(d.img)}<div class="opts">${rows}</div>`;
}

function navHtml() {
  const mk = (p, lab) => `<button class="nb ${answered(p) ? "done" : ""} ${p === st.cur ? "cur" : ""}" data-act="go" data-i="${p}" aria-label="Câu ${lab}">${lab}</button>`;
  return `<aside class="nav"><div class="card"><p class="grp">Phần I · Trắc nghiệm</p><div class="grid">${MCQ.map((_, p) => mk(p, p + 1)).join("")}</div></div>
    <div class="card"><p class="grp">Phần II · Đúng sai</p><div class="grid">${DS.map((_, j) => mk(MCQ.length + j, j + 1)).join("")}</div></div></aside>`;
}

function quizView() {
  const todo = Array.from({ length: TOTAL }, (_, p) => answered(p)).filter((x) => !x).length;
  const ask = st.ask ? `<div class="card" style="border-color:var(--key)"><p style="margin:0 0 10px"><b>Nộp bài?</b> ${todo ? `Em còn ${todo} câu chưa làm xong.` : "Em đã làm hết các câu."} Sau khi nộp không thể sửa.</p><div class="row"><button class="btn" data-act="submit">Nộp bài</button><button class="btn ghost" data-act="cancel">Làm tiếp</button></div></div>` : "";
  return `<div class="bar"><div><h1>Bài kiểm tra Trường hấp dẫn</h1><p class="sub">Vật lí 11 · ${esc(who.name.trim())} · Lớp ${esc(who.cls.trim())}</p></div>
      <div class="row"><span class="pill ${left() <= 300 ? "low" : ""}" id="clock">Còn ${mmss(left())}</span><span class="pill">Đã làm ${TOTAL - todo}/${TOTAL}</span><button class="btn" data-act="finish">Nộp bài</button></div></div>${ask}
    <main class="q"><div class="card" id="qcard">${qCard(st.cur)}
      <div class="nav2"><button class="btn ghost" data-act="prev" ${st.cur === 0 ? "disabled" : ""}>Câu trước</button><button class="btn ghost" data-act="next" ${st.cur === TOTAL - 1 ? "disabled" : ""}>Câu sau</button></div></div>${navHtml()}</main>`;
}

function resultView() {
  const r = scores();
  return `<div class="result">
    <div><h1>Đã nộp bài</h1><p class="sub">${esc(who.name.trim())} · Lớp ${esc(who.cls.trim())} · Thời gian làm bài ${elapsed()}</p><p class="sub" id="syncStatus" aria-live="polite">${saveState || "Đang chuẩn bị gửi điểm..."}</p></div>
    ${st.auto ? `<div class="explain" style="margin:0"><b>Bài được nộp tự động</b>${st.auto === "time" ? "Đã hết 35 phút làm bài." : "Em đã chuyển sang tab hoặc cửa sổ khác trong lúc làm bài."}</div>` : ""}
    <div class="card" style="display:grid;gap:14px"><div class="big num">${fmt(r.total)}<small> / 10 điểm</small></div>
      <div class="parts"><div class="part"><span>Phần I · Trắc nghiệm</span><b>${fmt(r.mp)} / 5</b></div>
      <div class="part"><span>Phần II · Đúng sai</span><b>${fmt(r.d)} / 5</b></div></div></div></div>`;
}

function render(keep) {
  const y = window.scrollY;
  app.innerHTML = st === null ? startView() : st.done ? resultView() : quizView();
  if (keep) window.scrollTo(0, y);
}
setInterval(() => {
  if (!st || st.done) return;
  if (left() <= 0) { submit("time"); return; }
  const c = $("#clock"); if (c) { c.textContent = "Còn " + mmss(left()); c.classList.toggle("low", left() <= 300); }
}, 1000);

/* ---------- sự kiện ---------- */
function submit(auto) { if (!st || st.done) return; st.done = true; st.auto = auto || false; st.ask = false; st.tEnd = Date.now(); saveState = "Đang gửi kết quả về Google Sheets..."; render(false); sendResultToSheet(); window.scrollTo(0, 0); }
function go(p) { st.cur = Math.max(0, Math.min(TOTAL - 1, p)); render(false); const c = $("#qcard"); if (c && window.innerWidth <= 860) c.scrollIntoView({ block: "start", behavior: "smooth" }); }
app.addEventListener("input", (e) => {
  if (e.target.id === "fname") who.name = e.target.value; else if (e.target.id === "fclass") who.cls = e.target.value; else return;
  $("#go").disabled = !(who.name.trim() && who.cls.trim());
});
app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || (st && st.done)) return;
  const a = b.dataset.act;
  if (a === "start") { if (!who.name.trim() || !who.cls.trim()) return; st = fresh(); render(false); window.scrollTo(0, 0); }
  else if (a === "pick") { st.mcq[+b.dataset.i] = +b.dataset.o; render(true); }
  else if (a === "tf") { st.ds[+b.dataset.j][+b.dataset.k] = b.dataset.v === "true"; render(true); }
  else if (a === "go") go(+b.dataset.i);
  else if (a === "prev") go(st.cur - 1);
  else if (a === "next") go(st.cur + 1);
  else if (a === "finish") { st.ask = true; render(true); }
  else if (a === "cancel") { st.ask = false; render(true); }
  else if (a === "submit") submit(false);
});
document.addEventListener("keydown", (e) => {
  if (!st || st.done || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "arrowright") go(st.cur + 1);
  else if (k === "arrowleft") go(st.cur - 1);
  else if (real(st.cur) < MCQ.length && k.length === 1 && "abcd".includes(k)) { st.mcq[real(st.cur)] = st.perm[real(st.cur)][k.charCodeAt(0) - 97]; render(true); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden && st && !st.done) submit(true); });
render(false);
</script>
